services:

  postgres:
    image: postgres:16
    container_name: postgres

    env_file:
      - .env

    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    volumes:
      - postgres_data:/var/lib/postgresql/data

    restart: always

  backend:
    build:
      context: ./backend

    container_name: backend

    env_file:
      - .env

    environment:
      DATABASE_URL: ${DATABASE_URL}

    depends_on:
      - postgres

    restart: always

    ports:
      - "8000:8000"

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend

    container_name: frontend

    depends_on:
      - backend

    restart: always

    ports:
      - "80:80"

volumes:
  postgres_data:
